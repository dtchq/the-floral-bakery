<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="iconRoseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6A9C2" />
      <stop offset="60%" stop-color="#E8698A" />
      <stop offset="100%" stop-color="#D45274" />
    </linearGradient>
    
    <linearGradient id="iconGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBA0" />
      <stop offset="50%" stop-color="#FFD966" />
      <stop offset="100%" stop-color="#E5BE44" />
    </linearGradient>

    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F4" />
      <stop offset="100%" stop-color="#FDE8EE" />
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E8698A" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#iconBgGrad)" stroke="#F6A9C2" stroke-width="2" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#iconGoldGrad)" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.85" />

  <!-- Botanical Rose Bloom Emblem -->
  <g transform="translate(50, 48) scale(1.15)" filter="url(#iconGlow)">
    <!-- Outer Petals -->
    <path d="M 0,-24 C 12,-16 18,-4 14,8 C 10,18 -4,22 -14,14 C -22,6 -18,-12 0,-24 Z" fill="url(#iconRoseGrad)" fill-opacity="0.3" stroke="#E8698A" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 0,-24 C -12,-16 -18,-4 -14,8 C -10,18 4,22 14,14 C 22,6 18,-12 0,-24 Z" fill="url(#iconRoseGrad)" fill-opacity="0.3" stroke="#E8698A" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Cross Petals -->
    <path d="M -24,0 C -16,-12 -4,-18 8,-14 C 18,-10 22,4 14,14 C 6,22 -12,18 -24,0 Z" fill="url(#iconRoseGrad)" fill-opacity="0.4" stroke="#E8698A" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 24,0 C 16,-12 4,-18 -8,-14 C -18,-10 -22,4 -14,14 C -6,22 12,18 24,0 Z" fill="url(#iconRoseGrad)" fill-opacity="0.4" stroke="#E8698A" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Inner Rose Core -->
    <path d="M 0,-12 C 7,-12 12,-7 12,0 C 12,8 6,13 0,13 C -6,13 -12,8 -12,0 C -12,-6 -7,-10 0,-10 C 5,-10 8,-6 8,-2 C 8,2 5,5 1,5 C -2,5 -4,3 -4,0" fill="none" stroke="#D45274" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Golden Stamen & Sparkle Dots -->
    <circle cx="0" cy="0" r="3.2" fill="url(#iconGoldGrad)" stroke="#4A3B36" stroke-width="0.8" />
    <circle cx="0" cy="-28" r="1.6" fill="#E5BE44" />
    <circle cx="28" cy="0" r="1.6" fill="#E5BE44" />
    <circle cx="0" cy="28" r="1.6" fill="#E5BE44" />
    <circle cx="-28" cy="0" r="1.6" fill="#E5BE44" />
  </g>
</svg>
